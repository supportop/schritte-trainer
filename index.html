<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Тренажер лексики Schritte plus Neu A1–B1 з адаптивними повтореннями">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Schritte Trainer — A1–B1</title>
<style>
:root{
  --bg:#0b1020;--panel:#121a2c;--panel2:#182238;--panel3:#0f1728;--text:#f3f4f6;
  --muted:#9ca3af;--line:#27324a;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --der:#60a5fa;--die:#fb7185;--das:#4ade80;--accent:#8b5cf6;--accent2:#6366f1;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  background:linear-gradient(160deg,#090e1b,#101827 50%,#0b1020);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:9px 10px 92px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.brand{font-size:18px;font-weight:900;letter-spacing:-.2px}
.subbrand,.small{font-size:10px;color:var(--muted)}
.save{font-size:9px;color:var(--muted);text-align:right}

.switcher{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:5px 0}
.kindbtn,.modebtn,.bookbtn,.sessionbtn{
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:10px;padding:7px 6px;font-weight:750
}
.kindbtn{font-size:14px}
.kindbtn.on,.modebtn.on{background:#2a2145;border-color:#6d5ac8;color:#fff}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:5px 0}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:2px 0 6px}
.books::-webkit-scrollbar{display:none}
.bookbtn{min-width:0;white-space:normal;padding:7px 4px!important;line-height:1.05}
.bookbtn.on{color:#fff;background:#1c2941;border-color:#60708d}
.bookbtn.future{border-style:dashed}
.bookbtn .level{display:block;font-size:13px;font-weight:900;color:#fff}.bookbtn .range{display:block;font-size:10px;margin-top:2px}.bookbtn .badge{display:block;font-size:8px;color:#7f8aa1;margin-top:2px}

.sessionbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:0 0 5px}
.sessionbar .label{font-size:10px;color:var(--muted);margin-right:0}
.sessionbtn{padding:5px 8px;border-radius:999px;font-size:10px}
.sessionbtn.on{background:#23314f;color:#fff;border-color:#5c6d8d}
.hardtoggle{margin-left:auto}
.hardtoggle.on{background:#4a2b16;color:#fde68a;border-color:#a16207}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:5px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center}
.stat b{display:block;font-size:13px}.stat span{font-size:7px;color:var(--muted)}

.progressline{height:5px;background:#101827;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:2px 0 6px}
.progressfill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);width:0%}

.card{
  min-height:300px;background:rgba(18,26,44,.97);border:1px solid var(--line);border-radius:16px;
  padding:16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.22);
  display:flex;flex-direction:column;justify-content:center;text-align:center
}
.counter{font-size:10px;color:var(--muted);margin-bottom:10px}
.word{font-size:34px;font-weight:900;line-height:1.06;overflow-wrap:anywhere}
.translation{font-size:17px;color:#d1d5db;margin-top:8px}
.hint{font-size:11px;color:var(--muted);margin-top:6px}

.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:18px}
.artbtn{border:0;border-radius:12px;padding:13px 6px;font-size:21px;font-weight:950;color:#08101f}
.der{background:var(--der)}.die{background:var(--die)}.das{background:var(--das)}

.choicegrid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:15px}
.choice{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);color:#fff;text-align:left}
.choice.good{border-color:var(--good);background:#13301f}
.choice.bad{border-color:var(--bad);background:#3a171b}

.spellrow{display:flex;gap:6px;margin-top:16px}
.spell{flex:1;min-width:0;background:#0e1628;border:1px solid #39455e;border-radius:10px;color:#fff;padding:11px 12px;font-size:16px}
.submit{background:#4f46e5;color:#fff;border:0;border-radius:14px;padding:0 18px;font-weight:850}
.umlauts{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.um{background:#202b43;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 13px}

.result{margin-top:21px;border-top:1px solid var(--line);padding-top:17px}
.feedback.good{color:#86efac;font-weight:850}.feedback.bad{color:#fca5a5;font-weight:850}
.biganswer{font-size:29px;font-weight:950;margin-top:9px;overflow-wrap:anywhere}
.c-der{color:var(--der)}.c-die{color:var(--die)}.c-das{color:var(--das)}
.plural{font-size:19px;margin-top:8px}.pluralPreview{font-size:14px;color:#cbd5e1;margin-top:7px}
.metaPills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#202b43;color:#cbd5e1;border:1px solid #33415c}
.actions{display:grid;grid-template-columns:1.35fr 1fr;gap:8px;margin-top:17px}
.action{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:12px;border-radius:12px}
.next{background:#4f46e5;border-color:#6366f1;font-weight:850}
.master{border-color:#35764b}.remove{border-color:#7f3d43;color:#fecaca}

.drawer{margin-top:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px}
.drawer summary{cursor:pointer;font-weight:800}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.setting{background:var(--panel3);padding:8px;border-radius:8px;font-size:11px}
.setting label{display:flex;gap:8px;align-items:center}
.setting select{width:100%;margin-top:6px;background:#0b1020;color:#fff;border:1px solid var(--line);padding:8px;border-radius:8px}

.manageHead{display:flex;gap:7px;margin:12px 0 7px;flex-wrap:wrap}
.manageHead button{border:1px solid var(--line);background:#182238;color:#cbd5e1;padding:7px 9px;border-radius:9px}
.manageHead button.on{background:#273553;color:#fff}
.search{width:100%;background:#0b1020;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.list{max-height:360px;overflow:auto;margin-top:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:9px 2px;text-align:left}
.row:first-child{border-top:0}.row .meta{font-size:11px;color:var(--muted);margin-top:3px}
.restore{background:#24314d;color:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.danger{color:#fca5a5}
.hardnum{color:#fbbf24;font-weight:800}

.bottom{
  position:fixed;left:0;right:0;bottom:0;background:rgba(11,16,32,.93);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  display:flex;justify-content:center
}
.bottomin{width:min(820px,100%);display:flex;gap:8px}
.bottom button{flex:1;background:#172033;color:#fff;border:1px solid var(--line);padding:11px;border-radius:11px}
.installSmall{border:1px solid #5b5bd6;background:#29275a;color:#fff;border-radius:9px;padding:6px 8px;font-size:10px;font-weight:800}
.hidden{display:none!important}

@media(max-width:580px){
  .wrap{padding-left:10px;padding-right:10px}
  .word{font-size:30px}.card{min-height:280px;padding:14px 11px}
  .stats{grid-template-columns:repeat(5,1fr)}.stat b{font-size:14px}.stat span{font-size:8px}
  .actions{grid-template-columns:1fr 1fr}.actions .next{grid-column:1/-1;grid-row:1}
  .settings{grid-template-columns:1fr}.modes{grid-template-columns:repeat(3,1fr)}
  .hardtoggle{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">Schritte Trainer</div>
      <div class="subbrand">A1 → B1 · Schritte 1–6</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button id="installBtn" class="installSmall hidden">Встановити</button>
      <div class="save" id="saved">прогрес зберігається</div>
    </div>
  </div>

  <div class="switcher">
    <button class="kindbtn on" data-kind="noun">Іменники</button>
    <button class="kindbtn" data-kind="verb">Дієслова</button>
  </div>

  <div class="modes" id="modes"></div>

  <div class="books">
    <button class="bookbtn on" data-book="1-2"><span class="level">A1</span><span class="range">Schritte 1–2</span></button>
    <button class="bookbtn" data-book="3-4"><span class="level">A2</span><span class="range">Schritte 3–4</span></button>
    <button class="bookbtn" data-book="5-6"><span class="level">B1</span><span class="range">Schritte 5–6</span></button>
  </div>

  <div class="sessionbar">
    <span class="label">Сесія:</span>
    <button class="sessionbtn on" data-limit="20">20</button>
    <button class="sessionbtn" data-limit="10">10</button>
    <button class="sessionbtn" data-limit="50">50</button>
    <button class="sessionbtn" data-limit="0">∞</button>
    <button class="sessionbtn hardtoggle" id="hardOnly">Складні слова</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="sSession">0/20</b><span>сесія</span></div>
    <div class="stat"><b id="sDue">0</b><span>до повтору</span></div>
    <div class="stat"><b id="sNew">0</b><span>нових</span></div>
    <div class="stat"><b id="sMaster">0</b><span>вивчено</span></div>
    <div class="stat"><b id="sAcc">—</b><span>точність</span></div>
  </div>
  <div class="progressline"><div class="progressfill" id="progressFill"></div></div>

  <section class="card" id="card"></section>

  <details class="drawer">
    <summary>Налаштування</summary>
    <div class="settings">
      <div class="setting"><label><input type="checkbox" id="showTrans" checked> Показувати переклад під час вибору артикля</label></div>
      <div class="setting"><label><input type="checkbox" id="includeOptional"> Додавати іменники з необов'язковим артиклем</label></div>
      <div class="setting">Після правильної відповіді
        <select id="autoNext">
          <option value="0">чекати «Далі»</option>
          <option value="700">через 0,7 с</option>
          <option value="1200">через 1,2 с</option>
        </select>
      </div>
      <div class="setting">Режим повторень
        <select id="pace">
          <option value="fast">інтенсивно до тесту</option>
          <option value="normal">звичайно</option>
        </select>
      </div>
    </div>
  </details>

  <details class="drawer" open>
    <summary>Слова, прогрес і вивчені</summary>
    <div class="manageHead">
      <button class="on" data-list="hard">Найскладніші</button>
      <button data-list="mastered">Вивчені</button>
    </div>
    <input class="search" id="search" placeholder="Пошук слова або перекладу…">
    <div class="list" id="manageList"></div>
  </details>
</div>

<div class="bottom">
  <div class="bottomin">
    <button id="exportBtn">Експорт прогресу</button>
    <button id="importBtn">Імпорт прогресу</button>
    <input id="importFile" type="file" accept="application/json" class="hidden">
  </div>
</div>

  let p=weightedPick(pool);
  if(current&&pool.length>1&&p.id===current.id){
    for(let i=0;i<8;i++){const q=weightedPick(pool);if(q.id!==current.id){p=q;break}}
  }
  return p;
}
function sessionLimit(){return Number(settings.sessionLimit||0)}
function nextWord(force=false){
  clearTimeout(autoTimer);
  if(!force && sessionLimit()>0 && session.answered>=sessionLimit()){
    session.complete=true;current=null;renderSessionDone();updateStats();return;
  }
  revealed=false;current=pickNext();
  if(!current){renderEmpty();updateStats();return}
  render();updateStats();
}
function restartSession(){
  session={answered:0,correct:0,wrong:0,streak:0,bestStreak:0,complete:false};
  nextWord(true);
}
function record(ok){
  if(revealed)return false;
  revealed=true;
  const m=modeState(current.id,currentMode());
  const now=Date.now();
  m.last=now;state.events++;session.answered++;
  if(ok){
    m.correct++;m.streak++;m.stage=Math.min(m.stage+1,9);m.due=now+intervalFor(m.stage);
    state.correct++;session.correct++;session.streak++;session.bestStreak=Math.max(session.bestStreak,session.streak);
  }else{
    m.wrong++;m.streak=0;m.stage=Math.max(0,m.stage-2);m.due=now+(settings.pace==='fast'?45e3:3*60e3);
    state.wrong++;session.wrong++;session.streak=0;
  }
  save();updateStats();renderManage();return true;
}
function maybeAuto(ok){const t=Number(settings.autoNext||0);if(ok&&t>0)autoTimer=setTimeout(()=>{if(revealed)nextWord()},t)}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nounFull(n){return `${n.article_label?n.article_label+' ':''}${n.noun}`}
function pluralText(n){return (!n.plural||n.plural==='—')?'—':`die ${n.plural}`}
function articleClass(n){const a=n.articles?.[0];return a==='der'?'c-der':a==='die'?'c-die':a==='das'?'c-das':''}
function sourceLine(x){return `Schritte ${x.book}${x.page?' · S. '+x.page:''}`}
function wordLabel(x){return x.type==='noun'?nounFull(x):x.verb}

function render(){
  if(!current)return renderEmpty();
  if(settings.kind==='noun'){
    if(currentMode()==='article')return renderArticle();
    if(currentMode()==='meaning')return renderMeaning();
    return renderNounSpelling();
  }else{
    if(currentMode()==='verbMeaning')return renderVerbMeaning();
    return renderVerbSpelling();
  }
}
function renderArticle(){
  const tr=settings.showTrans?`<div class="translation">${esc(current.translation)}</div>`:'';
  const note=current.articles?.length>1?'<div class="hint">У слова допустимо більше одного артикля</div>':'';
  const pl=(!current.plural||current.plural==='—')
    ? '<div class="pluralPreview">Plural: <b>—</b></div>'
    : `<div class="pluralPreview">Plural: <b>${esc(current.plural)}</b></div>`;
  card.innerHTML=`<div class="counter">${sourceLine(current)}</div>
    <div class="word">___ ${esc(current.noun)}</div>${pl}${tr}${note}
    <div class="answers">
      <button class="artbtn der" data-a="der">der</button>
      <button class="artbtn die" data-a="die">die</button>
      <button class="artbtn das" data-a="das">das</button>
    </div><div id="result"></div>`;
  document.querySelectorAll('.artbtn').forEach(b=>b.onclick=()=>answerArticle(b.dataset.a,b));
}
function answerArticle(a,b){
  if(revealed)return;
  const ok=current.articles.includes(a);record(ok);
  document.querySelectorAll('.artbtn').forEach(x=>{
    x.disabled=true;
    if(current.articles.includes(x.dataset.a))x.style.outline='3px solid white';
    if(x===b&&!ok)x.style.opacity='.42';
  });
  showNounResult(ok);maybeAuto(ok);
}
function buildOptions(items,currentItem,field){
  const opts=[currentItem];
  let pool=items.filter(x=>x.id!==currentItem.id&&x[field]!==currentItem[field]);
  shuffle(pool);
  for(const x of pool){if(opts.length>=4)break;if(!opts.some(o=>o[field]===x[field]))opts.push(x)}
  shuffle(opts);return opts;
}
function renderMeaning(){
  const opts=buildOptions(NOUNS.filter(bookAllowed),current,'translation');
  card.innerHTML=`<div class="counter">${sourceLine(current)}</div>
    <div class="word">${esc(nounFull(current))}</div><div class="hint">Що це означає?</div>
    <div class="choicegrid">${opts.map(o=>`<button class="choice" data-id="${o.id}">${esc(o.translation)}</button>`).join('')}</div>
    <div id="result"></div>`;
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerChoice(b.dataset.id,b,true));
}
function answerChoice(id,b,isNoun){
  if(revealed)return;
  const ok=id===current.id;record(ok);
  document.querySelectorAll('.choice').forEach(x=>{
    x.disabled=true;if(x.dataset.id===current.id)x.classList.add('good');else if(x===b)x.classList.add('bad')
  });
  if(isNoun)showNounResult(ok);else showVerbResult(ok);
  maybeAuto(ok);
}
function renderNounSpelling(){
  card.innerHTML=`<div class="counter">${sourceLine(current)}</div>
    <div class="translation">${esc(current.translation)}</div>
    <div class="hint">Напиши німецький іменник без артикля</div>
    ${spellControls()}<div id="result"></div>`;
  hookSpell(()=>answerNounSpelling());
}
function normNoun(s){return s.trim().replace(/^((der|die|das)\s+)/i,'').replace(/ß/g,'ss').toLocaleLowerCase('de-DE')}
function answerNounSpelling(){
  if(revealed)return;
  const inp=document.getElementById('spell');
  const ok=normNoun(inp.value)===normNoun(current.noun);record(ok);disableSpell();showNounResult(ok,inp.value);maybeAuto(ok);
}
function showNounResult(ok,typed=''){
  const note=current.note?`<div class="hint">${esc(current.note)}</div>`:'';
  const wrong=typed&&!ok?`<div class="hint">Ти написав: ${esc(typed)}</div>`:'';
  result.innerHTML=`<div class="result">
    <div class="feedback ${ok?'good':'bad'}">${ok?'Правильно ✓':'Помилка — слово повертатиметься частіше'}</div>${wrong}
    <div class="biganswer ${articleClass(current)}">${esc(nounFull(current))}</div>
    <div class="plural">Plural: <b>${esc(pluralText(current))}</b></div>
    <div class="translation">${esc(current.translation)}</div>${note}
    ${afterAnswerActions()}
  </div>`;
  hookAfterActions();
}

function renderVerbMeaning(){
  const opts=buildOptions(VERBS.filter(bookAllowed),current,'translation');
  card.innerHTML=`<div class="counter">${sourceLine(current)}</div>
    <div class="word">${esc(current.verb)}</div><div class="hint">Що означає це дієслово?</div>
    <div class="choicegrid">${opts.map(o=>`<button class="choice" data-id="${o.id}">${esc(o.translation)}</button>`).join('')}</div>
    <div id="result"></div>`;
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerChoice(b.dataset.id,b,false));
}
function renderVerbSpelling(){
  card.innerHTML=`<div class="counter">${sourceLine(current)}</div>
    <div class="translation">${esc(current.translation)}</div>
    <div class="hint">Напиши німецьке дієслово / інфінітив</div>
    ${spellControls()}<div id="result"></div>`;
  hookSpell(()=>answerVerbSpelling());
}
function normVerb(s){
  return s.trim().toLocaleLowerCase('de-DE')
    .replace(/·/g,'').replace(/[()]/g,'').replace(/\s+/g,' ')
    .replace(/ß/g,'ss').replace(/\.\.\./g,'');
}
function verbAccepted(input,v){
  const a=normVerb(input),b=normVerb(v.verb);
  if(a===b)return true;
  // Accept common equivalent placement of reflexive "sich".
  if(v.reflexive){
    const stripped=b.replace(/\s+sich\b/g,'').replace(/\bsich\s+/g,'').trim();
    const aa=a.replace(/\s+sich\b/g,'').replace(/\bsich\s+/g,'').trim();
    if(aa===stripped)return true;
  }
  // Parenthetical usage notes shouldn't be mandatory when typing the infinitive.
  const bare=b.replace(/\s+(es gibt|es geht|wie|das macht.*|kleidergröße|im internet).*$/,'').trim();
  return a===bare;
}
function answerVerbSpelling(){
  if(revealed)return;
  const inp=document.getElementById('spell');
  const ok=verbAccepted(inp.value,current);record(ok);disableSpell();showVerbResult(ok,inp.value);maybeAuto(ok);
}
function showVerbResult(ok,typed=''){
  const wrong=typed&&!ok?`<div class="hint">Ти написав: ${esc(typed)}</div>`:'';
  let pills=[];
  if(current.separable)pills.push('відокремлюване');
  if(current.reflexive)pills.push('зворотне');
  pills.push(sourceLine(current));
  result.innerHTML=`<div class="result">
    <div class="feedback ${ok?'good':'bad'}">${ok?'Правильно ✓':'Помилка — дієслово повертатиметься частіше'}</div>${wrong}
    <div class="biganswer">${esc(current.verb)}</div>
    <div class="translation">${esc(current.translation)}</div>
    <div class="metaPills">${pills.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
    ${afterAnswerActions()}
  </div>`;
  hookAfterActions();
}
function spellControls(){
  return `<div class="spellrow"><input class="spell" id="spell" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="submit" id="submitSpell">OK</button></div>
    <div class="umlauts">${['ä','ö','ü','ß','·'].map(x=>`<button class="um" data-ch="${x}">${x}</button>`).join('')}</div>`;
}
function hookSpell(fn){
  const inp=document.getElementById('spell');inp.focus();
  document.getElementById('submitSpell').onclick=fn;
  inp.onkeydown=e=>{if(e.key==='Enter')fn()};
  document.querySelectorAll('.um').forEach(b=>b.onclick=()=>{
    const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;
    inp.value=inp.value.slice(0,s)+b.dataset.ch+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1);
  });
}
function disableSpell(){document.getElementById('spell').disabled=true;document.getElementById('submitSpell').disabled=true}
function afterAnswerActions(){
  return `<div class="actions">
    <button class="action next" id="next">Далі</button>
    <button class="action master" id="master">✓ Вивчив</button>
  </div>`;
}
function hookAfterActions(){
  document.getElementById('next').onclick=()=>nextWord();
  document.getElementById('master').onclick=()=>markGlobal('mastered');
}
function markGlobal(kind){
  const g=globalState(current.id);g[kind]=true;save();renderManage();nextWord();
}

function renderSessionDone(){
  const pct=session.answered?Math.round(session.correct/session.answered*100):0;
  card.innerHTML=`<div class="word" style="font-size:30px">Сесію завершено ✓</div>
    <div class="translation">${session.correct} правильних · ${session.wrong} помилок · ${pct}%</div>
    <div class="hint">Найкраща серія: ${session.bestStreak}. Наступна сесія продовжить розумні повторення з того самого прогресу.</div>
    <div style="margin-top:24px"><button class="action next" id="restart" style="width:100%">Ще одна сесія</button></div>`;
  document.getElementById('restart').onclick=restartSession;
}
function renderEmpty(){
  const selected=selectedBooks();
  const hasBook=selected.some(n=>PACKS[n]?.loaded);
  let msg;
  if(!hasBook){
    msg='У цьому фільтрі зараз немає активних слів.';
  }else if(settings.hardOnly){
    msg='У цьому фільтрі поки немає складних слів. Помилися на слові кілька разів — і воно автоматично потрапить сюди.';
  }else{
    msg='У вибраному режимі немає активних слів. Перевір список «Вивчені» нижче.';
  }
  card.innerHTML=`<div class="word" style="font-size:28px">Поки порожньо</div><div class="translation">${esc(msg)}</div>`;
}
function updateStats(){
  const arr=allItems().filter(bookAllowed),now=Date.now(),mode=currentMode();
  let due=0,nw=0,master=0;
  for(const x of arr){
    const g=state.words[x.id];
    if(g?.mastered){master++;continue}
    if(settings.kind==='noun'&&mode==='article'&&!x.article_quiz&&!settings.includeOptional)continue;
    if(settings.hardOnly&&!isHard(x))continue;
    const m=modeState(x.id,mode);
    if(!m.last)nw++;else if(m.due<=now)due++;
  }
  const lim=sessionLimit();
  sSession.textContent=lim?`${Math.min(session.answered,lim)}/${lim}`:`${session.answered}/∞`;
  sDue.textContent=due;sNew.textContent=nw;sMaster.textContent=master;
  const t=state.correct+state.wrong;sAcc.textContent=t?Math.round(state.correct/t*100)+'%':'—';
  progressFill.style.width=lim?Math.min(100,(session.answered/lim)*100)+'%':'0%';
}

function difficultyScore(x){
  const a=attempts(x);
  if(!a.total)return 0;
  return a.w*4 + a.rate*10 + Math.max(0,a.w-a.c)*2;
}
function renderManage(){
  const q=(search?.value||'').trim().toLocaleLowerCase('uk-UA');
  const mode=settings.listMode;
  let arr=[...NOUNS,...VERBS];
  arr=arr.filter(x=>{
    const g=state.words[x.id],txt=(wordLabel(x)+' '+(x.translation||'')).toLocaleLowerCase('uk-UA');
    if(q&&!txt.includes(q))return false;
    if(mode==='mastered')return !!g?.mastered;
    return isHard(x)&&!g?.mastered;
  });
  if(mode==='hard')arr.sort((a,b)=>difficultyScore(b)-difficultyScore(a));
  arr=arr.slice(0,180);

  if(!arr.length){
    manageList.innerHTML=`<div class="small" style="padding:10px 2px">${mode==='hard'?'Поки немає слів, на яких ти систематично помиляєшся.':'Список порожній.'}</div>`;
    return;
  }
  manageList.innerHTML=arr.map(x=>{
    const g=state.words[x.id],a=attempts(x);
    let right='';
    if(mode==='hard')right=`<span class="hardnum">${a.w} пом.</span>`;
    else right=`<button class="restore" data-id="${x.id}">Повернути у вивчення</button>`;
    return `<div class="row"><div><b>${esc(wordLabel(x))}</b> — ${esc(x.translation)}
      <div class="meta">${x.type==='noun'?'іменник':'дієслово'} · Schritte ${x.book} · правильно ${a.c}, помилок ${a.w}</div></div>${right}</div>`;
  }).join('');
  manageList.querySelectorAll('.restore').forEach(b=>b.onclick=()=>{
    const g=state.words[b.dataset.id];if(g){g.mastered=false;save();renderManage();updateStats()}
  });
}

function renderModes(){
  const nounModes=[
    ['article','Артикль'],['meaning','Переклад'],['spelling','Правопис']
  ];
  const verbModes=[
    ['verbMeaning','Переклад'],['verbSpelling','Правопис']
  ];
  const arr=settings.kind==='noun'?nounModes:verbModes;
  modes.style.gridTemplateColumns=`repeat(${arr.length},1fr)`;
  modes.innerHTML=arr.map(([id,label])=>`<button class="modebtn ${(currentMode()===id)?'on':''}" data-mode="${id}">${label}</button>`).join('');
  modes.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>{
    if(settings.kind==='noun')settings.nounMode=b.dataset.mode;else settings.verbMode=b.dataset.mode;
    save();renderModes();restartSession();
  });
}

document.querySelectorAll('.kindbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.kindbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  settings.kind=b.dataset.kind;save();renderModes();restartSession();renderManage();
});
document.querySelectorAll('.bookbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.bookbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  settings.book=b.dataset.book;save();restartSession();
});
document.querySelectorAll('.sessionbtn[data-limit]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.sessionbtn[data-limit]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  settings.sessionLimit=Number(b.dataset.limit);save();restartSession();
});
hardOnly.onclick=()=>{
  settings.hardOnly=!settings.hardOnly;hardOnly.classList.toggle('on',settings.hardOnly);save();restartSession();
};
document.querySelectorAll('.manageHead button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.manageHead button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  settings.listMode=b.dataset.list;save();renderManage();
});

showTrans.checked=settings.showTrans;includeOptional.checked=settings.includeOptional;autoNext.value=settings.autoNext;pace.value=settings.pace;
showTrans.onchange=()=>{settings.showTrans=showTrans.checked;save();render()};
includeOptional.onchange=()=>{settings.includeOptional=includeOptional.checked;save();restartSession()};
autoNext.onchange=()=>{settings.autoNext=autoNext.value;save()};
pace.onchange=()=>{settings.pace=pace.value;save()};
search.oninput=renderManage;

function applyImportedProgress(raw){
  try{
    const x=typeof raw==='string'?JSON.parse(raw):raw;
    if(x.state)state=x.state;
    if(x.settings)settings=Object.assign(settings,x.settings);
    for(const g of Object.values(state.words||{})){if(g&&g.removed){g.mastered=true;delete g.removed;}}
    save();location.reload();
  }catch(e){alert('Не вдалося прочитати файл прогресу.');}
}
window.receiveNativeProgress=applyImportedProgress;

exportBtn.onclick=()=>{
  const payload=JSON.stringify({version:5,state,settings,exported:new Date().toISOString()},null,2);
  try{
    if(window.AndroidStore&&AndroidStore.exportProgress){AndroidStore.exportProgress(payload);return;}
  }catch(e){}
  const blob=new Blob([payload],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='schritte-trainer-progress.json';a.click();URL.revokeObjectURL(a.href);
};
importBtn.onclick=()=>{
  try{
    if(window.AndroidStore&&AndroidStore.importProgress){AndroidStore.importProgress();return;}
  }catch(e){}
  importFile.click();
};
importFile.onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>applyImportedProgress(r.result);
  r.readAsText(f);
};

// Restore UI
document.querySelectorAll('.kindbtn').forEach(x=>x.classList.toggle('on',x.dataset.kind===settings.kind));
document.querySelectorAll('.bookbtn').forEach(x=>x.classList.toggle('on',x.dataset.book===String(settings.book)));
document.querySelectorAll('.sessionbtn[data-limit]').forEach(x=>x.classList.toggle('on',Number(x.dataset.limit)===Number(settings.sessionLimit)));
hardOnly.classList.toggle('on',!!settings.hardOnly);
document.querySelectorAll('.manageHead button').forEach(x=>x.classList.toggle('on',x.dataset.list===settings.listMode));

save();renderModes();renderManage();nextWord(true);
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredInstallPrompt=e;
  const b=document.getElementById('installBtn');if(b)b.classList.remove('hidden');
});
const installBtn=document.getElementById('installBtn');
if(installBtn)installBtn.onclick=async()=>{
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  try{await deferredInstallPrompt.userChoice}catch(e){}
  deferredInstallPrompt=null;installBtn.classList.add('hidden');
};
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.classList.add('hidden')});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}
</script>
</body></html>
